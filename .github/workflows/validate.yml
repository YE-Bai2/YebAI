name: Validate

on:
  push:
    branches:
      - main
      - phase-6-video-task-workbench
      - phase-8-workspace-backup
  pull_request:
    branches:
      - main
      - phase-6-video-task-workbench

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Build production app
        run: npm run build
