name: Validate YebAI
on:
  push:
    branches: [main, phase-2-story-workflow, phase-3-ai-script-generation]
  pull_request:
    branches: [main, phase-2-story-workflow]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
