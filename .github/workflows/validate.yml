name: Validate YebAI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/fal-ai-video-generation]
jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
